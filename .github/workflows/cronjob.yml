name: Freex Monitor Cronjob

on:
  schedule:
    # 毎日 日本時間の 8:00, 12:00, 18:00 に定期実行します
    # (UTC時間で指定するため、日本時間から9時間引いた数値を設定しています)
    - cron: '0 23,3,9 * * *'
  workflow_dispatch: # 手動実行用ボタンを有効化

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    
    # 状態ファイル(json)をリポジトリに保存するための権限設定
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          LINE_NOTIFY_TOKEN: ${{ secrets.LINE_NOTIFY_TOKEN }}
          TZ: 'Asia/Tokyo' # ログ出力を日本時間にする
        run: python scraper.py

      - name: Commit and Push state file
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update state file [skip ci]"
          file_pattern: 'freex_state.json'
